{% extends "layout.html" %}

{% block title %}Edit Meal{% endblock %}

{% block content %}
    <section class="meal-card">
        <h2>Edit meal</h2>

        {% if errors %}
            <div class="form-error">
                <ul>
                    {% for error in errors %}
                        <li>{{ error }}</li>
                    {% endfor %}
                </ul>
            </div>
        {% endif %}

        <form action="/meal/{{ meal.id }}/edit" method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <p>
                <label for="name">Meal name:</label><br>
                <input type="text" id="name" name="name" value="{{ meal_name if meal_name is defined else meal.name }}" pattern="\S.*" title="Meal name cannot start with whitespace or contain only whitespace." required>
            </p>

            <p>
                <label for="meal_type">Meal type:</label><br>
                <select id="meal_type" name="meal_type" required>
                    {% for meal_type in meal_types %}
                        <option value="{{ meal_type.name }}" {% if meal.meal_type == meal_type.name %}selected{% endif %}>{{ meal_type.name }}</option>
                    {% endfor %}
                </select>
            </p>

            <p>
                <label for="calories">Calories (kcal):</label><br>
                <input type="number" id="calories" name="calories" min="0" value="{{ meal.calories or 0 }}">
            </p>

            <p>
                <label for="protein">Protein (g):</label><br>
                <input type="number" id="protein" name="protein" min="0" value="{{ meal.protein or 0 }}">
            </p>

            <p>
                <label for="carbs">Carbohydrates (g):</label><br>
                <input type="number" id="carbs" name="carbs" min="0" value="{{ meal.carbs or 0 }}">
            </p>

            <p>
                <label for="fat">Fat (g):</label><br>
                <input type="number" id="fat" name="fat" min="0" value="{{ meal.fat or 0 }}">
            </p>

            <p>
                <label for="price">Price (€):</label><br>
                <input type="number" id="price" name="price" min="0" step="0.01" value="{{ meal.price or 0.0 }}">
            </p>

            <p>
                <strong>Diet categories:</strong><br>
                {% for diet in diets %}
                    <label>
                        <input type="checkbox" name="diets" value="{{ diet.id }}" {% if diet.id|string in selected_diets %}checked{% endif %}>
                        {{ diet.name }}
                    </label><br>
                {% endfor %}
            </p>

            <button type="submit">Save changes</button>
        </form>

        <p>
            <a href="/" class="action-link">Back to home</a>
        </p>
    </section>
{% endblock %}
